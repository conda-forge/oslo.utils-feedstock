{% set name = "oslo.utils" %}
{% set version = "10.3.0" %}
{% set bundle = "tar.gz" %}
{% set hash = "25f4d339b42c497eae08dc0a5b8727c22cba39f2a62fbf84923d24efcc0ce738" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ bundle }}
  url: https://files.pythonhosted.org/packages/35/25/74f0b7f1d28d96953b3c9e39026f94e9bac59dcb3a0322675de2b29c2acb/oslo_utils-{{ version }}.tar.gz
  sha256: {{ hash }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pbr !=2.1.0,>=2.0.0

  run:
    - python >={{ python_min }}
    - iso8601 >=0.1.11
    - oslo.i18n >=3.15.3
    - netaddr >=0.10.0
    - debtcollector >=1.2.0
    - pyparsing >=2.1.0
    - packaging >=20.4
    - python-tzdata >=2022.4
    - PyYAML >=3.13
    - psutil >=3.2.2

test:
  imports:
    - oslo_utils
    - oslo_utils.encodeutils
    - oslo_utils.eventletutils
    - oslo_utils.excutils
    - oslo_utils.fileutils
    - oslo_utils.importutils
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://docs.openstack.org/developer/oslo.utils/
  license_file: LICENSE
  license: Apache-2.0
  license_family: Apache
  summary: Support for common utility type functions, such as encoding, exception handling, string manipulation, and time handling.
  doc_url: https://docs.openstack.org/developer/oslo.utils/
  dev_url: https://git.openstack.org/cgit/openstack/oslo.utils

extra:
  recipe-maintainers:
    - anguslees
    - tschoonj
